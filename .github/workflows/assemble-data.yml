name: Assemble GTA Clone data parts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Download all four release parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p parts
          gh release download V1.0 --repo "${GITHUB_REPOSITORY}" --pattern 'RUSSIAN-3GB-Port.zip.t0.001' --dir parts
          gh release download v1.0-data --repo "${GITHUB_REPOSITORY}" --pattern 'RUSSIAN-3GB-Port.zip.t0.002' --dir parts
          gh release download V1.0-data --repo "${GITHUB_REPOSITORY}" --pattern 'RUSSIAN-3GB-Port.zip.t0.003' --dir parts
          gh release download V1.0-Data --repo "${GITHUB_REPOSITORY}" --pattern 'RUSSIAN-3GB-Port.zip.t0.004' --dir parts
          ls -lh parts

      - name: Join and validate archive
        run: |
          cat \
            parts/RUSSIAN-3GB-Port.zip.t0.001 \
            parts/RUSSIAN-3GB-Port.zip.t0.002 \
            parts/RUSSIAN-3GB-Port.zip.t0.003 \
            parts/RUSSIAN-3GB-Port.zip.t0.004 \
            > RUSSIAN-3GB-Port-joined.zip
          unzip -tq RUSSIAN-3GB-Port-joined.zip

      - name: Install 7z inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Inspect ZIP and nested 7z archive
        run: |
          python3 - <<'PY'
          import zipfile, collections, shutil, subprocess, os
          path = "RUSSIAN-3GB-Port-joined.zip"
          output = []
          with zipfile.ZipFile(path) as outer:
              infos = outer.infolist()
              files = [x for x in infos if not x.is_dir()]
              roots = collections.Counter(x.filename.split('/')[0] for x in infos if x.filename)
              output += [f"Outer archive: {path}", f"Entries total: {len(infos)}", f"Files: {len(files)}", f"Uncompressed bytes: {sum(x.file_size for x in files)}", "", "Outer top-level entries:"]
              output += [f"{name} ({count} entries)" for name, count in roots.most_common(100)]
              output += ["", "Outer file entries:"]
              output += [f"{x.file_size:>14}  {x.filename}" for x in files[:300]]
              nested = [x for x in files if x.filename.lower().endswith(".zip")]
              for item in nested:
                  output += ["", f"Nested archive: {item.filename}"]
                  try:
                      with outer.open(item) as nested_stream:
                          with zipfile.ZipFile(nested_stream) as inner:
                              inner_infos = inner.infolist()
                              inner_files = [x for x in inner_infos if not x.is_dir()]
                              inner_roots = collections.Counter(x.filename.split('/')[0] for x in inner_infos if x.filename)
                              output += [f"Nested entries total: {len(inner_infos)}", f"Nested files: {len(inner_files)}", f"Nested uncompressed bytes: {sum(x.file_size for x in inner_files)}", "", "Nested top-level entries:"]
                              output += [f"{name} ({count} entries)" for name, count in inner_roots.most_common(200)]
                              output += ["", "First 500 nested file entries:"]
                              output += [f"{x.file_size:>14}  {x.filename}" for x in inner_files[:500]]
                              seven_files = [x for x in inner_files if x.filename.lower().endswith(".7z")]
                              for seven in seven_files:
                                  seven_path = os.path.basename(seven.filename)
                                  output += ["", f"Nested 7z archive: {seven.filename}", f"7z size: {seven.file_size} bytes"]
                                  with inner.open(seven) as src, open(seven_path, "wb") as dst:
                                      shutil.copyfileobj(src, dst, length=8 * 1024 * 1024)
                                  listing = subprocess.run(["7z", "l", "-slt", seven_path], capture_output=True, text=True)
                                  output += ["", "7z listing (first 500 lines):"] + listing.stdout.splitlines()[:500]
                                  if listing.returncode != 0:
                                      output += [f"7z listing error: {listing.stderr[-2000:]}"]
                                  test = subprocess.run(["7z", "t", "-bb0", seven_path], capture_output=True, text=True)
                                  output += ["", f"7z integrity test: {'PASS' if test.returncode == 0 else 'FAIL'}"]
                                  output += test.stdout.splitlines()[-30:]
                                  if test.returncode != 0:
                                      output += test.stderr.splitlines()[-30:]
                  except Exception as e:
                      output.append(f"Could not inspect nested ZIP: {type(e).__name__}: {e}")
          with open("GTA-Clone-archive-inventory.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(output) + "\n")
          PY

      - name: Save assembled ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Clone-joined-data
          path: RUSSIAN-3GB-Port-joined.zip
          if-no-files-found: error
          retention-days: 7

      - name: Save archive inventory as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA-Clone-archive-inventory
          path: GTA-Clone-archive-inventory.txt
          if-no-files-found: error
          retention-days: 7
